; ==============================================================================
; Asterisk's built-in HTTP server — required for ARI (see ari.conf), which
; the AI call controller uses for call control.
;
; Bound to 127.0.0.1 only. Never expose this port publicly — ARI has full
; call-control authority. On a real VPS deployment, the AI backend runs on
; the same host, so localhost-only is sufficient; if it ever needs to run
; elsewhere, use WireGuard (see docs/network.md, not yet written) rather
; than opening this to the internet.
; ==============================================================================

[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
