; ==============================================================================
; Internal context: SIP softphone test extensions (1001-1003) and a local
; entry point into the IVR for testing without a trunk/gateway.
; ==============================================================================

[internal]
; Extension-to-extension test calls.
exten => 1001,1,NoOp(Call to 1001 from ${CALLERID(num)}, call ${UNIQUEID})
 same => n,Gosub(sub-recording,start,1(1001))
 same => n,Dial(PJSIP/1001,${RING_TIMEOUT},tT)
 same => n,Goto(dialstatus,1)

exten => 1002,1,NoOp(Call to 1002 from ${CALLERID(num)}, call ${UNIQUEID})
 same => n,Gosub(sub-recording,start,1(1002))
 same => n,Dial(PJSIP/1002,${RING_TIMEOUT},tT)
 same => n,Goto(dialstatus,1)

exten => 1003,1,NoOp(Call to 1003 from ${CALLERID(num)}, call ${UNIQUEID})
 same => n,Gosub(sub-recording,start,1(1003))
 same => n,Dial(PJSIP/1003,${RING_TIMEOUT},tT)
 same => n,Goto(dialstatus,1)

; Shared post-dial handling for the extensions above.
exten => dialstatus,1,NoOp(Dial result ${DIALSTATUS} for call ${UNIQUEID})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(failed)
 same => n(busy),NoOp(Destination busy, call ${UNIQUEID})
 same => n,Hangup()
 same => n(noanswer),NoOp(Destination did not answer, call ${UNIQUEID})
 same => n,Hangup()
 same => n(failed),NoOp(Call failed, status=${DIALSTATUS}, call ${UNIQUEID})
 same => n,Hangup()
 same => n(done),Hangup()

; Local test entry point into the IVR (dial 600 from any registered
; softphone). This stands in for the real inbound trunk context
; ("from-smg4004", added once the physical gateway is available and its
; SIP behavior is verified — REQUIRES PHYSICAL SMG4004) which will Goto
; this same ivr-menu context on an incoming GSM call.
exten => 600,1,NoOp(IVR test entry from ${CALLERID(num)}, call ${UNIQUEID})
 same => n,Goto(ivr-menu,s,1)
