; ==============================================================================
; Basic IVR: "Welcome. Press 1 for Staff 1, 2 for Staff 2, or 3 for Staff 3."
;
; Routes to the same test SIP extensions (1001-1003) used for direct
; softphone-to-softphone calls — NOT to GSM/mobile numbers. Real staff/GSM
; routing is REQUIRES PHYSICAL SMG4004 and is added once the gateway exists
; and staff numbers are supplied (see docs/client-information-required.md).
;
; Audio: the Background()/Playback() calls below reference custom/ivr-*
; prompts that are not yet recorded. Asterisk logs a WARNING and continues
; silently if a sound file is missing, so the dialplan logic (routing,
; retries, timeout, invalid-input handling) is fully testable by DTMF alone
; even before real prompts exist — record actual audio (or wire up TTS in
; a later phase) before this goes to production.
; ==============================================================================

[ivr-menu]
exten => s,1,NoOp(=== IVR call start, call ${UNIQUEID}, caller ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Gosub(sub-recording,start,1(ivr))
 same => n,Set(__IVR_ATTEMPTS=0)
 same => n(menu),Set(__IVR_ATTEMPTS=$[${IVR_ATTEMPTS} + 1])
 same => n,NoOp(IVR attempt ${IVR_ATTEMPTS} of ${IVR_MAX_RETRIES}, call ${UNIQUEID})
 same => n,GotoIf($[${IVR_ATTEMPTS} > ${IVR_MAX_RETRIES}]?maxretries)
 same => n,Set(TIMEOUT(digit)=${IVR_DIGIT_TIMEOUT})
 same => n,Set(TIMEOUT(response)=${IVR_RESPONSE_TIMEOUT})
 same => n,Background(custom/ivr-welcome-menu)
 same => n,WaitExten()
 same => n(maxretries),NoOp(IVR max retries exceeded, call ${UNIQUEID})
 same => n,Playback(custom/ivr-goodbye)
 same => n,Hangup()

exten => 1,1,NoOp(IVR selection 1 -> extension 1001, call ${UNIQUEID})
 same => n,Set(CDR(userfield)=ivr_option:1)
 same => n,Goto(internal,1001,1)

exten => 2,1,NoOp(IVR selection 2 -> extension 1002, call ${UNIQUEID})
 same => n,Set(CDR(userfield)=ivr_option:2)
 same => n,Goto(internal,1002,1)

exten => 3,1,NoOp(IVR selection 3 -> extension 1003, call ${UNIQUEID})
 same => n,Set(CDR(userfield)=ivr_option:3)
 same => n,Goto(internal,1003,1)

; Invalid DTMF (anything not matched above, e.g. 4-9, *, #).
exten => i,1,NoOp(IVR invalid input, call ${UNIQUEID})
 same => n,Playback(custom/ivr-invalid)
 same => n,Goto(s,menu)

; No input within TIMEOUT(response).
exten => t,1,NoOp(IVR timeout, call ${UNIQUEID})
 same => n,Playback(custom/ivr-timeout)
 same => n,Goto(s,menu)
