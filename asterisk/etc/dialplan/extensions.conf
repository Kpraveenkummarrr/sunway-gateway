; ==============================================================================
; Dialplan master file — deployed as /etc/asterisk/extensions.conf.
;
; Phase 3 scope: SIP softphone testing only (extensions 1001-1003), a basic
; IVR that routes to those same test extensions, and call recording. No
; GSM/SMG4004 routing exists yet — see docs/architecture.md for what is
; READY WITHOUT GATEWAY vs REQUIRES PHYSICAL SMG4004.
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Recording output root. Must be writable by the asterisk user (see
; docs/asterisk.md for the exact permissions/setup).
RECORDING_BASE_DIR=/var/spool/asterisk/recordings

; IVR behavior. These mirror the defaults in backend/.env.example
; (IVR_MAX_RETRIES, IVR_INPUT_TIMEOUT_SECONDS) — kept as dialplan constants
; for now; wiring the dialplan to read live config from the Phase 2 database
; is a later-phase integration, not part of this telephony foundation.
IVR_MAX_RETRIES=3
IVR_DIGIT_TIMEOUT=5
IVR_RESPONSE_TIMEOUT=8

; Ring timeout for staff/test-extension dials (seconds).
RING_TIMEOUT=20

#include internal.conf
#include ivr.conf
#include recording.conf
