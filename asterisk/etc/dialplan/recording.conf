; ==============================================================================
; Shared recording subroutine, called via Gosub from any context that
; answers/bridges a call (internal extension-to-extension calls, IVR-routed
; calls). Keeps MixMonitor setup in one place instead of duplicated per
; context.
;
; Output filename encodes callid_timestamp_caller_destination, per the
; project convention (docs/asterisk.md), so recordings can later be
; correlated with the `recordings` table from Phase 2 (call_id, caller,
; destination, timestamps) once that wiring is built.
; ==============================================================================

[sub-recording]
exten => start,1,NoOp(Recording: starting for call ${UNIQUEID} caller=${CALLERID(num)} dest=${ARG1})
 same => n,Set(REC_DIR=${RECORDING_BASE_DIR}/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,System(mkdir -p -m 750 "${REC_DIR}")
 same => n,System(chmod 750 "${REC_DIR}")
 same => n,Set(REC_FILE=${REC_DIR}/${UNIQUEID}_${STRFTIME(${EPOCH},,%H%M%S)}_${CALLERID(num)}_${ARG1}.wav)
 same => n,MixMonitor(${REC_FILE},b)
 same => n,Set(CDR(userfield)=${REC_FILE})
 same => n,NoOp(Recording: writing to ${REC_FILE})
 same => n,Return()
