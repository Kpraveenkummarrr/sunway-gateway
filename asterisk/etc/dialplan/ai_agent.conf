; ==============================================================================
; AI call test entry point — extension 700 (AI_TEST_EXTENSION in
; backend/.env). Hands the channel to ARI's "ai-agent" Stasis app; the
; Python AI call controller (backend/app/ai_call_worker.py) takes it from
; there — answers, plays a welcome prompt, and drives the record -> STT ->
; RAG -> LLM -> TTS -> playback loop (see docs/asterisk.md and
; docs/architecture.md).
;
; Added to the existing [internal] context (defined in internal.conf) via
; a separate file/context declaration, so internal.conf itself — and the
; existing 1001/1002/1003/600 extensions — are untouched.
;
; If no AI call controller process is running (ARI has no app registered
; for "ai-agent"), Stasis() fails immediately and priority n+1 handles it
; gracefully instead of leaving the caller in dead air.
; ==============================================================================

[internal]
exten => 700,1,NoOp(AI agent test call from ${CALLERID(num)}, call ${UNIQUEID})
 same => n,Set(TALK_DETECT(set)=200,500)
 same => n,Stasis(ai-agent)
 same => n,NoOp(Stasis app ai-agent exited or was unavailable for call ${UNIQUEID})
 same => n,Playback(custom/ivr-goodbye)
 same => n,Hangup()
