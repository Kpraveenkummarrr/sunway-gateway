; ==============================================================================
; Call-centre department routing.
;
; The IVR sends a caller here after they press a digit. Who gets rung is NOT
; configured in this file: route_agi.py asks the backend (departments +
; agents, managed from the admin API), so staff numbers, priorities, backups
; and ring timeouts can change without touching telephony config.
;
; Destinations are tried in order; each dial result is reported back so it
; lands in the call history. When nobody answers, the department's
; no_answer_action decides what happens ("ai" hands over to the AI agent).
;
; SUNWAY_DIAL_PREFIX (see extensions.conf) selects how a number is dialled —
; the GSM trunk in production, a local PJSIP endpoint for softphone testing.
; ==============================================================================

[departments]
exten => _[0-9],1,NoOp(Department request: digit=${EXTEN} caller=${CALLERID(num)} call=${UNIQUEID})
 same => n,Set(ROUTE_COUNT=0)
 same => n,AGI(route_agi.py,${EXTEN})
 same => n,GotoIf($[${ROUTE_COUNT} < 1]?unavailable)
 same => n,Set(IDX=1)
 same => n,While($[${IDX} <= ${ROUTE_COUNT}])
 same => n,Set(DEST=${ROUTE_${IDX}})
 same => n,Verbose(1,Ringing ${ROUTE_LABEL_${IDX}} at ${DEST} (${IDX} of ${ROUTE_COUNT}) for ${ROUTE_DEPARTMENT})
 same => n,Dial(${SUNWAY_DIAL_PREFIX}${DEST},${ROUTE_TIMEOUT},tT)
 same => n,AGI(route_agi.py,attempt,${IDX},${DEST},${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?answered)
 same => n,Set(IDX=$[${IDX} + 1])
 same => n,EndWhile()
 same => n,Goto(noanswer)

 same => n(answered),NoOp(Call answered by staff for ${ROUTE_DEPARTMENT}, call ${UNIQUEID})
 same => n,Hangup()

 same => n(noanswer),NoOp(No destination answered for ${ROUTE_DEPARTMENT} — action=${ROUTE_NO_ANSWER_ACTION})
 same => n,GotoIf($["${ROUTE_NO_ANSWER_ACTION}" = "ai"]?ai)
 same => n,Goto(bye)

 same => n(ai),NoOp(Handing caller to the AI agent after no answer, call ${UNIQUEID})
 same => n,Goto(internal,${AI_EXTENSION},1)

 same => n(unavailable),NoOp(No department configured for digit ${EXTEN}, call ${UNIQUEID})
 same => n,Playback(custom/ivr-invalid)
 same => n,Goto(ivr-menu,s,menu)

 same => n(bye),Playback(custom/ivr-goodbye)
 same => n,Hangup()
