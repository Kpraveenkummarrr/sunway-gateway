; ==============================================================================
; RTP port range. Default Asterisk range (10000-20000) is fine for a
; low-resource dev/VPS host — each call uses one port pair from this range,
; so it comfortably covers far more than the SMG4004's 4 GSM channels plus
; a handful of softphones.
; ==============================================================================

[general]
rtpstart=10000
rtpend=20000
icesupport=no
