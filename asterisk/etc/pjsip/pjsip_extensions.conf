; ==============================================================================
; Test SIP extensions (1001-1003) for local softphone testing.
;
; These exist so the IVR, dialplan, and recording can be developed and
; tested end-to-end without the physical SMG4004 gateway (READY WITHOUT
; GATEWAY — see docs/architecture.md). They are not meant to survive into
; production as-is; staff/GSM routing is configured separately once the
; gateway is available.
;
; Passwords are NOT defined here — each endpoint references an auth id of
; the same name (e.g. "1001") whose secret lives in pjsip_auth.conf, which
; is generated locally and gitignored (see asterisk/scripts/generate_sip_secrets.sh
; and pjsip_auth.conf.example for the template).
;
; Codec choice: ulaw/alaw are the common denominator for GSM gateway trunks
; and SIP softphones alike; opus is offered for softphone-to-softphone calls
; but should not be assumed available once the SMG4004 trunk exists (REQUIRES
; PHYSICAL SMG4004 to confirm actual codec support).
; ==============================================================================

[endpoint-template](!)
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
allow_subscribe=no
send_pai=no

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---- Extension 1001 ----
[1001](endpoint-template)
auth=1001
aors=1001

[1001](aor-template)

; ---- Extension 1002 ----
[1002](endpoint-template)
auth=1002
aors=1002

[1002](aor-template)

; ---- Extension 1003 ----
[1003](endpoint-template)
auth=1003
aors=1003

[1003](aor-template)
