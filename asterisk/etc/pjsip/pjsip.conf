; ==============================================================================
; PJSIP master configuration
;
; This is the file Asterisk actually loads as /etc/asterisk/pjsip.conf (see
; asterisk/scripts/deploy.sh). It only #includes the split-out files below so
; each concern (transport, test endpoints, SMG4004 trunk, auth secrets) stays
; separate and auth secrets can be gitignored independently of everything
; else.
;
; Phase 3 scope: local transport + three test SIP extensions (1001-1003) for
; softphone testing only. No SMG4004 trunk is defined here yet — that is
; REQUIRES PHYSICAL SMG4004 and is added in a later phase once the gateway's
; actual SIP behavior has been verified (see docs/architecture.md).
; ==============================================================================

#include pjsip_transport.conf
#include pjsip_extensions.conf
#include pjsip_auth.conf
