; ==============================================================================
; PJSIP transport
;
; A single UDP transport bound to all interfaces on the standard SIP port.
; Suitable for local softphone testing on a development host/VPS.
;
; When the SMG4004 trunk is added (later phase), verify against the
; gateway's actual documented transport requirements (UDP/TCP/TLS) before
; assuming this transport is sufficient for it too — REQUIRES PHYSICAL
; SMG4004 to confirm.
; ==============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; local_net / external_media_address / external_signaling_address are left
; unset here (no NAT) — this is a local/dev config. Set them when deploying
; behind NAT (e.g. VPS with the SMG4004 reached over WireGuard) per
; docs/network.md (added when Phase 23 network setup is implemented).
