; ==============================================================================
; Logging levels. "verbose" is enabled (in addition to the Asterisk package
; defaults notice/warning/error) so the NoOp() trace lines in our dialplan
; (call start, IVR selection, dial result, invalid input, timeout, recording
; path) actually land in /var/log/asterisk/messages and are debuggable
; without an attached console. See docs/asterisk.md.
; ==============================================================================

[general]

[logfiles]
console => notice,warning,error,verbose
messages => notice,warning,error,verbose
